# Docker service addresses can change when the API container is recreated.
# resolve is supported by the deployed nginx 1.27.5 (requires >= 1.27.3).
upstream ozon_api {
  zone ozon_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server api:3001 resolve;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://ozon_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 130s;
    client_max_body_size 55m;
  }
  location /listing-media/v1/ {
    proxy_pass http://ozon_api;
    proxy_http_version 1.1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
