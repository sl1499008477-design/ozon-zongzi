<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>ozon 粽子组件同尺度 QA 对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; width: 2000px; background: #eef3fb; color: #10234a; font: 14px/1.4 system-ui, sans-serif; }
      h1, h2 { margin: 0 0 12px; }
      h2 { margin-top: 24px; font-size: 17px; }
      main { display: grid; gap: 20px; align-items: start; }
      .panel-grid { grid-template-columns: 353px 353px; }
      .settings-grid { grid-template-columns: 962px 962px; }
      figure { margin: 0; background: #fff; border: 1px solid #d4e2fa; border-radius: 10px; overflow: hidden; }
      figcaption { padding: 8px 10px; font-weight: 700; }
      img { display: block; max-width: none; border-top: 1px solid #d4e2fa; }
      .panel-grid img { width: 353px; height: 489px; }
      .settings-grid img { width: auto; height: auto; }
    </style>
  </head>
  <body>
    <h1>组件同尺度：reference 与最新 production fixture</h1>
    <h2>数据面板可见区域 — 两侧均为 353 × 489 CSS px，1× 密度</h2>
    <main class="panel-grid">
      <figure>
        <figcaption>Reference component</figcaption>
        <img src="ozon-zongzi-reference-panel-component.png" alt="原型面板组件" />
      </figure>
      <figure>
        <figcaption>Implementation component</figcaption>
        <img src="ozon-zongzi-implementation-panel-component.png" alt="生产面板组件" />
      </figure>
    </main>
    <h2>设置弹窗本体 — reference 956 × 713，implementation 962 × 609 CSS px，均为 1× 密度</h2>
    <main class="settings-grid">
      <figure>
        <figcaption>Reference component</figcaption>
        <img src="ozon-zongzi-reference-settings-component.png" alt="原型设置弹窗组件" />
      </figure>
      <figure>
        <figcaption>Implementation component</figcaption>
        <img src="ozon-zongzi-implementation-settings-component.png" alt="生产设置弹窗组件" />
      </figure>
    </main>
  </body>
</html>
