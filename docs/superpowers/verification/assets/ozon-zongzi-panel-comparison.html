<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>ozon 粽子面板 QA 对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: #eef3fb; color: #10234a; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; background: #fff; border: 1px solid #d4e2fa; border-radius: 12px; overflow: hidden; }
      figcaption { padding: 8px 12px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border-top: 1px solid #d4e2fa; }
    </style>
  </head>
  <body>
    <h1>数据面板：reference 与 production fixture implementation</h1>
    <main>
      <figure>
        <figcaption>Reference — 原型整屏（1280 × 706）</figcaption>
        <img src="ozon-zongzi-reference-panel.png" alt="原型数据面板" />
      </figure>
      <figure>
        <figcaption>Implementation — 真实生产渲染 fixture（1280 × 706）</figcaption>
        <img src="ozon-zongzi-implementation-panel.png" alt="生产数据面板渲染" />
      </figure>
    </main>
  </body>
</html>
