services:
  postgres:
    image: postgres:16-alpine
    container_name: sonli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonli_local}
      POSTGRES_USER: ${POSTGRES_USER:-sonli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - sonli_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonli} -d ${POSTGRES_DB:-sonli_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: sonli-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:?Set MINIO_PORT in .env}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?Set MINIO_CONSOLE_PORT in .env}:9001"
    volumes:
      - sonli_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: sonli-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env} ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env};
      mc mb --ignore-existing local/${MINIO_BUCKET:-sonli-local-files};
      "
    restart: "no"

  api:
    profiles: ["application"]
    build:
      context: .
      target: backend
    restart: unless-stopped
    command: ["node", "server/index.mjs"]
    environment: &application-environment
      NODE_ENV: production
      QH_LOCAL_API_HOST: 0.0.0.0
      QH_LOCAL_API_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sonli_local}
      POSTGRES_USER: ${POSTGRES_USER:-sonli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSL: "false"
      POSTGRES_STATE_TABLE: local_state
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-sonli-local-files}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      APP_ENCRYPTION_KEY_VERSION: ${APP_ENCRYPTION_KEY_VERSION:-v1}
      SONLI_ADMIN_USERNAME: ${SONLI_ADMIN_USERNAME:-admin}
      SONLI_ADMIN_PASSWORD: ${SONLI_ADMIN_PASSWORD:?Set SONLI_ADMIN_PASSWORD in .env}
      LISTING_PIPELINE_V3: "1"
      AUTO_LISTING_ENABLED: ${AUTO_LISTING_ENABLED:-false}
      AUTO_LISTING_AI_ENABLED: ${AUTO_LISTING_AI_ENABLED:-false}
      AUTO_LISTING_EXCEL_MAX_BYTES: ${AUTO_LISTING_EXCEL_MAX_BYTES:-2097152}
      AUTO_LISTING_EXCEL_MAX_ROWS: ${AUTO_LISTING_EXCEL_MAX_ROWS:-1000}
      AUTO_LISTING_AI_ALLOWED_SECRET_ENV_NAMES: ${AUTO_LISTING_AI_ALLOWED_SECRET_ENV_NAMES:-}
      AUTO_LISTING_AI_ALLOWED_GATEWAY_BASE_URLS: ${AUTO_LISTING_AI_ALLOWED_GATEWAY_BASE_URLS:-}
      AUTO_LISTING_AI_ALLOWED_GATEWAY_ORIGINS: ${AUTO_LISTING_AI_ALLOWED_GATEWAY_ORIGINS:-}
      AUTO_LISTING_AI_ALLOW_LOCAL_GATEWAY: ${AUTO_LISTING_AI_ALLOW_LOCAL_GATEWAY:-false}
      AUTO_LISTING_CREDENTIAL_MASTER_KEY: ${AUTO_LISTING_CREDENTIAL_MASTER_KEY:-}
      AUTO_LISTING_CREDENTIAL_MASTER_KEY_FILE: ${AUTO_LISTING_CREDENTIAL_MASTER_KEY_FILE:+/run/secrets/auto-listing-credential-master.key}
      AUTO_LISTING_CREDENTIAL_KEY_VERSION: ${AUTO_LISTING_CREDENTIAL_KEY_VERSION:-local-v1}
      AUTO_LISTING_UPLOAD_ENABLED: ${AUTO_LISTING_UPLOAD_ENABLED:-false}
      AUTO_LISTING_DIRECT_UPLOAD_ALLOWED: ${AUTO_LISTING_DIRECT_UPLOAD_ALLOWED:-false}
      LISTING_ASSET_PUBLIC_BASE_URL: ${LISTING_ASSET_PUBLIC_BASE_URL:-}
      LISTING_ASSET_PUBLIC_PREFIX: ${LISTING_ASSET_PUBLIC_PREFIX:-listing-media/v1}
      LISTING_ASSET_PUBLICATION_VERSION: ${LISTING_ASSET_PUBLICATION_VERSION:-LISTING_MEDIA_V1}
      SUB2API_API_KEY: ${SUB2API_API_KEY:-}
      PG_BOSS_SCHEMA: ${PG_BOSS_SCHEMA:-sonli_queue}
      LISTING_WORKER_CONCURRENCY: ${LISTING_WORKER_CONCURRENCY:-2}
      LISTING_MAX_STATUS_CHECKS: ${LISTING_MAX_STATUS_CHECKS:-240}
      OZON_CATEGORY_RULE_VERSION: ${OZON_CATEGORY_RULE_VERSION:-2026-07-v1}
      OZON_DICTIONARY_VERSION: ${OZON_DICTIONARY_VERSION:-live-api}
      OZON_RICH_CONTENT_RULE_VERSION: ${OZON_RICH_CONTENT_RULE_VERSION:-2026-07-v1}
    expose:
      - "3001"
    volumes: &credential-file-mount
      - type: bind
        source: ${AUTO_LISTING_CREDENTIAL_MASTER_KEY_FILE:-/dev/null}
        target: /run/secrets/auto-listing-credential-master.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/local/storage/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    profiles: ["application"]
    build:
      context: .
      target: backend
    restart: unless-stopped
    command: ["node", "server/listing-worker.mjs"]
    environment: *application-environment
    volumes: *credential-file-mount
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    profiles: ["application"]
    build:
      context: .
      target: web
      args:
        VITE_LOCAL_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISH_HOST:-127.0.0.1}:${WEB_PORT:?Set WEB_PORT in .env}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sonli_postgres_data:
  sonli_minio_data:
