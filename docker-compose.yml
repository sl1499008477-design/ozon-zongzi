services:
  postgres:
    image: postgres:16-alpine
    container_name: sonli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonli_local}
      POSTGRES_USER: ${POSTGRES_USER:-sonli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonli_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sonli_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonli} -d ${POSTGRES_DB:-sonli_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: sonli-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-sonli_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-sonli_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - sonli_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: sonli-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-sonli_minio} ${MINIO_SECRET_KEY:-sonli_minio_password};
      mc mb --ignore-existing local/${MINIO_BUCKET:-sonli-local-files};
      "
    restart: "no"

volumes:
  sonli_postgres_data:
  sonli_minio_data:
