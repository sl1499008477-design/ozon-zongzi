<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/extension/content/ozon-product.css" />
    <style>
      body { margin: 0; padding: 24px; background: #f4f7fb; }
      .tile-root { width: 100%; max-width: 640px; }
      .tile-root > a { display: block; }
    </style>
  </head>
  <body>
    <article class="tile-root">
      <a href="/product/fixture-product-123456789" aria-label="fixture product">fixture product</a>
    </article>
    <script>
      const fixtureStorage = {};
      let sellerContextStatus = { status: "LOGIN_REQUIRED" };
      window.__setSellerContextStatus = (next) => {
        sellerContextStatus = { ...next };
      };
      let fixtureStorageMode = "success";
      let fixtureStorageSetCalls = 0;
      const fixtureStorageSetPayloads = [];
      const fixtureStoragePendingSets = [];
      window.__setPanelStorageFixtureMode = (mode) => { fixtureStorageMode = mode; };
      window.__setPanelStorageFixtureState = (next) => {
        Object.keys(fixtureStorage).forEach((key) => delete fixtureStorage[key]);
        Object.assign(fixtureStorage, next || {});
        fixtureStorageSetCalls = 0;
        fixtureStorageSetPayloads.length = 0;
        fixtureStoragePendingSets.length = 0;
      };
      window.__getPanelStorageFixtureState = () => ({
        values: { ...fixtureStorage },
        setCalls: fixtureStorageSetCalls,
        payloads: fixtureStorageSetPayloads.map((payload) => ({ ...payload })),
        pendingSets: fixtureStoragePendingSets.length,
      });
      window.__resolveNextPanelStorageSet = (outcome = "success") => {
        const pending = fixtureStoragePendingSets.shift();
        if (!pending) throw new Error("no delayed storage callback to resolve");
        pending(outcome);
      };
      window.chrome = {
        runtime: {
          id: "panel-fixture",
          lastError: null,
          getURL: (asset) => `/extension/${asset}`,
          sendMessage(message, callback) {
            const data = message?.action === "getAuth" ? { loggedIn: true } : {};
            callback?.({ ok: true, data });
          },
          onMessage: { addListener() {} },
        },
        storage: {
          local: {
            get(keys, callback) {
              const keyList = Array.isArray(keys) ? keys : [keys];
              const value = Object.fromEntries(keyList.filter((key) => key in fixtureStorage).map((key) => [key, fixtureStorage[key]]));
              callback?.(value);
              return Promise.resolve(value);
            },
            set(next, callback) {
              fixtureStorageSetCalls += 1;
              fixtureStorageSetPayloads.push({ ...next });
              const finish = (outcome) => {
                if (outcome === "failure") {
                  window.chrome.runtime.lastError = { message: "fixture storage failed" };
                  callback?.();
                  window.chrome.runtime.lastError = null;
                  return;
                }
                Object.assign(fixtureStorage, next);
                callback?.();
              };
              if (fixtureStorageMode === "deferred") {
                fixtureStoragePendingSets.push(finish);
                return Promise.resolve();
              }
              finish(fixtureStorageMode);
              return Promise.resolve();
            },
          },
          onChanged: { addListener() {} },
        },
      };
    </script>
    <script src="/extension/lib/sidebar-section-toggle.js"></script>
    <script src="/extension/content/shared-utils.js"></script>
    <script>
      window.JZTaskQueue = class {
        add(_key, task) { return Promise.resolve().then(task); }
      };
      window.jzMakeStaggeredQueue = () => ({ add: (task) => Promise.resolve().then(task), setParams() {} });
      window.jzFetchPublicFollowSell = async () => ({ count: 0, sellers: [] });
      const collectFixtureMode = new URLSearchParams(window.location.search).get("collect");
      const collectFixtureEnabled = Boolean(collectFixtureMode);
      window.checkAuth = async () => ({
        loggedIn: collectFixtureMode !== "auth-missing",
        account: collectFixtureMode === "auth-missing" ? null : { id: "fixture-account" },
        permissions: collectFixtureMode === "auth-missing" ? [] : ["collector.upload"],
      });
      if (collectFixtureMode !== "auth-missing") {
        window.jzDataCardAllowed = async () => ({ allowed: true });
      }
      const collectFixtureMessages = [];
      let collectFixtureVariantCalls = 0;
      const collectFixtureSourceVariant = {
        variant_id: "123456789",
        _searchMeta: { skus: [{ sku: "123456789" }] },
        description_category_id: 17012345,
        type_id: 910001,
        attributes: [
          { key: "4180", value: "fixture product" },
          { key: "4497", value: "350" },
          { key: "9454", value: "120" },
          { key: "9455", value: "80" },
          { key: "9456", value: "30" },
        ],
      };
      window.__getCollectFixtureMessages = () =>
        collectFixtureMessages.map((message) => JSON.parse(JSON.stringify(message)));
      const collectFixtureOpenedUrls = [];
      window.__getCollectFixtureOpenedUrls = () => [...collectFixtureOpenedUrls];
      window.open = (url, target) => {
        collectFixtureOpenedUrls.push({ url: String(url), target: String(target || "") });
        return null;
      };
      const completeEnrichment = (overrides = {}) => ({
        status: "COMPLETE",
        contractVersion: "collector.ozon.enrichment.v1",
        sku: "123456789",
        descriptionCategoryId: 17012345,
        typeId: 910001,
        logistics: { weightG: 350, lengthMm: 120, widthMm: 80, heightMm: 30 },
        variantData: collectFixtureSourceVariant,
        source: "BACKEND_FLEET",
        capturedAt: "2026-07-31T00:00:00.000Z",
        cache: {
          hit: collectFixtureMode === "cache",
          expiresAt: "2026-07-31T06:00:00.000Z",
        },
        ...overrides,
      });
      const throwFixtureError = (code, message, extra = {}) => {
        throw Object.assign(new Error(message), { code, ...extra });
      };
      window.sendMessage = async (action, payload) => {
        if (action === "getSellerContextStatus") {
          return { status: sellerContextStatus.status, companyId: sellerContextStatus.companyId, observedAt: sellerContextStatus.observedAt };
        }
        if (action === "openSellerLogin") return { opened: true };
        if (!collectFixtureEnabled) return { data: {}, items: [] };
        collectFixtureMessages.push({ action, payload });
        if (action === "enrichOzonCollect") {
          if (collectFixtureMode === "pending-hang") {
            return new Promise(() => {});
          }
          if (collectFixtureMode === "collector-auth") {
            throwFixtureError("COLLECTOR_AUTH_REQUIRED", "Collector auth required", { status: 401 });
          }
          if ([
            "backend-failure",
            "local-failure",
            "seller-auth",
            "fast-lane",
            "variant-retry",
            "variant-retry-again",
            "variant-retry-cache-swap",
            "variant-retry-wrong-sku",
            "variant-retry-empty",
            "variant-retry-malformed",
          ].includes(collectFixtureMode)) {
            throwFixtureError("OZON_ENRICH_UPSTREAM_FAILED", "backend unavailable", {
              status: 502,
              retryable: true,
            });
          }
          const missingByMode = {
            missing: ["descriptionCategoryId", "weightG", "lengthMm", "widthMm", "heightMm"],
            "missing-category": ["descriptionCategoryId"],
            "missing-weight": ["weightG"],
            "missing-length": ["lengthMm"],
            "missing-width": ["widthMm"],
            "missing-height": ["heightMm"],
          };
          if (missingByMode[collectFixtureMode]) {
            throwFixtureError("OZON_ENRICH_INCOMPLETE", "incomplete", {
              status: 422,
              missingFields: missingByMode[collectFixtureMode],
              retryable: true,
            });
          }
          if (collectFixtureMode === "cold") {
            await new Promise((resolve) => setTimeout(resolve, 700));
          }
          return completeEnrichment();
        }
        if (action === "getMarketStats" && collectFixtureMode === "fast-lane") {
          return {
            soldCount: 72,
            gmvSum: 7000,
            views: 900,
            convViewToOrder: 8,
            discount: 10,
          };
        }
        if (action === "searchVariants") {
          collectFixtureVariantCalls += 1;
          if (
            collectFixtureMode === "variant-retry"
            || collectFixtureMode === "variant-retry-again"
            || collectFixtureMode === "variant-retry-cache-swap"
            || collectFixtureMode === "variant-retry-wrong-sku"
            || collectFixtureMode === "variant-retry-empty"
            || collectFixtureMode === "variant-retry-malformed"
            || collectFixtureMode === "variant-retry-backend-success"
          ) {
            if (collectFixtureMode === "variant-retry-cache-swap") {
              if (collectFixtureVariantCalls === 1) {
                await new Promise((resolve) => setTimeout(resolve, 300));
                throwFixtureError("SELLER_CAPTURE_FAILED", "delayed initial variant failure", {
                  retryable: true,
                });
              }
              await new Promise((resolve) => setTimeout(resolve, 100));
              return { items: [collectFixtureSourceVariant] };
            }
            if (
              collectFixtureMode === "variant-retry-wrong-sku"
              || collectFixtureMode === "variant-retry-empty"
              || collectFixtureMode === "variant-retry-malformed"
              || collectFixtureMode === "variant-retry-backend-success"
            ) {
              if (collectFixtureVariantCalls === 1) {
                throwFixtureError("SELLER_CAPTURE_FAILED", "fixture initial variant capture failed", {
                  retryable: true,
                });
              }
              if (collectFixtureVariantCalls === 2) {
                if (collectFixtureMode === "variant-retry-empty") return { items: [] };
                if (collectFixtureMode === "variant-retry-malformed") {
                  return { items: { unexpected: collectFixtureSourceVariant } };
                }
                return {
                  items: [{
                    ...collectFixtureSourceVariant,
                    sku: "987654321",
                    _searchMeta: { skus: [{ sku: "987654321" }] },
                  }],
                };
              }
              return { items: [collectFixtureSourceVariant] };
            }
            const mustReject = collectFixtureVariantCalls === 1
              || (collectFixtureMode === "variant-retry-again" && collectFixtureVariantCalls === 2);
            if (mustReject) {
              throwFixtureError("SELLER_CAPTURE_FAILED", "fixture variant capture failed", {
                retryable: true,
              });
            }
            await new Promise((resolve) => setTimeout(resolve, 150));
            return { items: [collectFixtureSourceVariant] };
          }
          if (
            collectFixtureMode === "missing"
            || collectFixtureMode.startsWith("missing-")
            || collectFixtureMode === "backend-failure"
            || collectFixtureMode === "local-failure"
          ) return { items: [] };
          if (collectFixtureMode === "seller-auth") {
            const error = new Error("Seller 页面已打开，但公司上下文尚未就绪");
            error.code = "SELLER_CONTEXT_REQUIRED";
            throw error;
          }
          if (collectFixtureMode === "fast-lane") {
            await new Promise((resolve) => setTimeout(resolve, 500));
            return { items: [collectFixtureSourceVariant] };
          }
          return collectFixtureVariantCalls === 1
            ? { items: [collectFixtureSourceVariant] }
            : { items: [] };
        }
        if (action === "pushSourceCollect") {
          if (collectFixtureMode === "upload-auth-401" || collectFixtureMode === "upload-auth-403") {
            const status = collectFixtureMode.endsWith("401") ? 401 : 403;
            throw Object.assign(new Error("upload auth expired"), { status });
          }
          if (collectFixtureMode === "upload-failure") {
            throwFixtureError("COLLECTOR_UPLOAD_FAILED", "upload failed", { status: 502, retryable: true });
          }
          return {
            dedupeHit: false,
            result: {
              id: "collect-fixture",
              enrichment: { status: "PENDING_ENRICHMENT" },
            },
          };
        }
        return { data: {}, items: [] };
      };
      window.__setPanelFixtureWidth = (width) => {
        document.querySelector(".tile-root").style.width = `${width}px`;
      };
    </script>
    <script src="/extension/lib/ozon-enrichment-contract.js"></script>
    <script src="/extension/lib/ozon-collect-coordinator.js"></script>
    <script src="/extension/content/ozon-data-panel.js"></script>
  </body>
</html>
