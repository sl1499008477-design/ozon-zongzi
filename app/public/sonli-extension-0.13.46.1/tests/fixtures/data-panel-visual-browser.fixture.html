<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/extension/content/ozon-product.css" />
    <style>
      body { margin: 0; padding: 24px; background: #f4f7fb; }
      .tile-root { width: 100%; max-width: 640px; }
      .tile-root > a { display: block; }
    </style>
  </head>
  <body>
    <article class="tile-root">
      <a href="/product/fixture-product-123456789" aria-label="fixture product">fixture product</a>
    </article>
    <script>
      const fixtureStorage = {};
      let fixtureStorageMode = "success";
      let fixtureStorageSetCalls = 0;
      const fixtureStorageSetPayloads = [];
      const fixtureStoragePendingSets = [];
      window.__setPanelStorageFixtureMode = (mode) => { fixtureStorageMode = mode; };
      window.__setPanelStorageFixtureState = (next) => {
        Object.keys(fixtureStorage).forEach((key) => delete fixtureStorage[key]);
        Object.assign(fixtureStorage, next || {});
        fixtureStorageSetCalls = 0;
        fixtureStorageSetPayloads.length = 0;
        fixtureStoragePendingSets.length = 0;
      };
      window.__getPanelStorageFixtureState = () => ({
        values: { ...fixtureStorage },
        setCalls: fixtureStorageSetCalls,
        payloads: fixtureStorageSetPayloads.map((payload) => ({ ...payload })),
        pendingSets: fixtureStoragePendingSets.length,
      });
      window.__resolveNextPanelStorageSet = (outcome = "success") => {
        const pending = fixtureStoragePendingSets.shift();
        if (!pending) throw new Error("no delayed storage callback to resolve");
        pending(outcome);
      };
      window.chrome = {
        runtime: {
          id: "panel-fixture",
          lastError: null,
          getURL: (asset) => `/extension/${asset}`,
          sendMessage(message, callback) {
            const data = message?.action === "getAuth" ? { loggedIn: true } : {};
            callback?.({ ok: true, data });
          },
          onMessage: { addListener() {} },
        },
        storage: {
          local: {
            get(keys, callback) {
              const keyList = Array.isArray(keys) ? keys : [keys];
              const value = Object.fromEntries(keyList.filter((key) => key in fixtureStorage).map((key) => [key, fixtureStorage[key]]));
              callback?.(value);
              return Promise.resolve(value);
            },
            set(next, callback) {
              fixtureStorageSetCalls += 1;
              fixtureStorageSetPayloads.push({ ...next });
              const finish = (outcome) => {
                if (outcome === "failure") {
                  window.chrome.runtime.lastError = { message: "fixture storage failed" };
                  callback?.();
                  window.chrome.runtime.lastError = null;
                  return;
                }
                Object.assign(fixtureStorage, next);
                callback?.();
              };
              if (fixtureStorageMode === "deferred") {
                fixtureStoragePendingSets.push(finish);
                return Promise.resolve();
              }
              finish(fixtureStorageMode);
              return Promise.resolve();
            },
          },
          onChanged: { addListener() {} },
        },
      };
    </script>
    <script src="/extension/lib/sidebar-section-toggle.js"></script>
    <script src="/extension/content/shared-utils.js"></script>
    <script>
      window.JZTaskQueue = class {
        add(_key, task) { return Promise.resolve().then(task); }
      };
      window.jzMakeStaggeredQueue = () => ({ add: (task) => Promise.resolve().then(task), setParams() {} });
      window.jzFetchPublicFollowSell = async () => ({ count: 0, sellers: [] });
      const collectFixtureMode = new URLSearchParams(window.location.search).get("collect");
      const collectFixtureEnabled = ["1", "missing", "auth-missing", "seller-auth"].includes(collectFixtureMode);
      window.checkAuth = async () => ({
        loggedIn: collectFixtureMode !== "auth-missing",
        account: collectFixtureMode === "auth-missing" ? null : { id: "fixture-account" },
        permissions: collectFixtureMode === "auth-missing" ? [] : ["collector.upload"],
      });
      if (collectFixtureMode !== "auth-missing") {
        window.jzDataCardAllowed = async () => ({ allowed: true });
      }
      const collectFixtureMessages = [];
      let collectFixtureVariantCalls = 0;
      const collectFixtureSourceVariant = {
        variant_id: "123456789",
        description_category_id: 17012345,
        type_id: 910001,
        attributes: [
          { key: "4180", value: "fixture product" },
          { key: "4497", value: "350" },
          { key: "9454", value: "120" },
          { key: "9455", value: "80" },
          { key: "9456", value: "30" },
        ],
      };
      window.__getCollectFixtureMessages = () =>
        collectFixtureMessages.map((message) => JSON.parse(JSON.stringify(message)));
      window.sendMessage = async (action, payload) => {
        if (!collectFixtureEnabled) return { data: {}, items: [] };
        collectFixtureMessages.push({ action, payload });
        if (action === "searchVariants") {
          collectFixtureVariantCalls += 1;
          if (collectFixtureMode === "missing") return { items: [] };
          if (collectFixtureMode === "seller-auth") {
            const error = new Error("Seller 页面已打开，但公司上下文尚未就绪");
            error.code = "SELLER_CONTEXT_REQUIRED";
            throw error;
          }
          return collectFixtureVariantCalls === 1
            ? { items: [collectFixtureSourceVariant] }
            : { items: [] };
        }
        if (action === "pushSourceCollect") {
          return { result: { id: "collect-fixture" } };
        }
        return { data: {}, items: [] };
      };
      window.__setPanelFixtureWidth = (width) => {
        document.querySelector(".tile-root").style.width = `${width}px`;
      };
    </script>
    <script src="/extension/content/ozon-data-panel.js"></script>
  </body>
</html>
